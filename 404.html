<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#f3f7f6">
<title>AI心世界</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
  :root {
    --bg: #f3f7f6;
    --ink: #1c3a33;
    --ink-soft: #5d7771;
    --mint-1: #e9f4f0;
    --mint-2: #cfe7df;
    --teal: #2f8a79;
    --btn-1: #2e4f48;
    --btn-2: #1b322d;
    --err: #b24a3f;
    --line: rgba(255, 255, 255, .78);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: ui-sans-serif, system-ui, -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    -webkit-font-smoothing: antialiased;
    display: grid;
    place-items: center;
    padding: 24px 16px;
    overflow-x: hidden;
  }
  /* 柔和的背景光斑，呼应站内的薄荷绿玻璃质感 */
  body::before, body::after {
    content: "";
    position: fixed;
    z-index: -1;
    border-radius: 50%;
    filter: blur(60px);
    pointer-events: none;
  }
  body::before {
    width: 62vmax; height: 62vmax;
    left: -18vmax; top: -24vmax;
    background: radial-gradient(circle at 50% 50%, rgba(160, 214, 196, .55), rgba(160, 214, 196, 0) 70%);
  }
  body::after {
    width: 56vmax; height: 56vmax;
    right: -20vmax; bottom: -26vmax;
    background: radial-gradient(circle at 50% 50%, rgba(196, 226, 238, .6), rgba(196, 226, 238, 0) 70%);
  }
  /* 登录卡片：和教师端一样的薄荷绿玻璃卡片 */
  .card {
    width: min(420px, 100%);
    padding: 34px 36px 36px;
    border-radius: 28px;
    background: linear-gradient(160deg, rgba(255, 255, 255, .86), rgba(226, 242, 236, .78));
    border: 1px solid var(--line);
    box-shadow: 0 1px 0 rgba(255, 255, 255, .9) inset, 0 28px 64px -26px rgba(28, 72, 62, .32), 0 2px 10px rgba(28, 72, 62, .06);
    -webkit-backdrop-filter: blur(18px) saturate(1.2);
    backdrop-filter: blur(18px) saturate(1.2);
    animation: rise .6s cubic-bezier(.2, .8, .2, 1) both;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(10px) scale(.985); } }
  /* 站点自己的 logo（白色立体字，衬在一块浅薄荷绿底上才看得清，和教师端顶栏一样） */
  .brand { display: flex; justify-content: center; margin: 0 -8px 26px; padding: 18px 12px 16px; border-radius: 20px;
    background: linear-gradient(180deg, #d9ece5, #c9e3da); box-shadow: 0 1px 0 rgba(255, 255, 255, .8) inset, 0 8px 20px -14px rgba(28, 72, 62, .35); }
  .brand img { width: min(300px, 100%); height: auto; display: block; }
  .vh { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  form { margin: 0; }
  .field { position: relative; margin-bottom: 14px; }
  .field svg { position: absolute; left: 16px; top: 50%; width: 18px; height: 18px; margin-top: -9px; color: #7d958f; pointer-events: none; }
  input {
    width: 100%;
    height: 52px;
    padding: 0 16px 0 46px;
    border-radius: 16px;
    border: 1px solid rgba(47, 138, 121, .18);
    background: rgba(255, 255, 255, .9);
    color: var(--ink);
    font: inherit;
    font-size: 16px;
    letter-spacing: .04em;
    outline: none;
    box-shadow: 0 1px 2px rgba(28, 72, 62, .06) inset;
    transition: border-color .2s, box-shadow .2s;
  }
  input::placeholder { color: #9bb0ab; letter-spacing: .08em; }
  input:focus { border-color: rgba(47, 138, 121, .55); box-shadow: 0 0 0 4px rgba(47, 138, 121, .12); }
  input[aria-invalid="true"] { border-color: rgba(178, 74, 63, .55); box-shadow: 0 0 0 4px rgba(178, 74, 63, .1); }
  .msg { min-height: 22px; margin: 0 0 10px; font-size: 14px; color: var(--err); text-align: center; }
  .msg.info { color: var(--ink-soft); }
  button {
    width: 100%;
    height: 52px;
    border: 0;
    border-radius: 16px;
    background: linear-gradient(180deg, var(--btn-1), var(--btn-2));
    color: #fff;
    font: inherit;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: .3em;
    text-indent: .3em;
    cursor: pointer;
    box-shadow: 0 10px 22px -10px rgba(27, 50, 45, .6), 0 1px 0 rgba(255, 255, 255, .18) inset;
    transition: transform .15s, box-shadow .2s, opacity .2s;
    display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  }
  button:hover { box-shadow: 0 14px 26px -10px rgba(27, 50, 45, .65), 0 1px 0 rgba(255, 255, 255, .18) inset; }
  button:active { transform: translateY(1px); }
  button:focus-visible { outline: 3px solid rgba(47, 138, 121, .45); outline-offset: 3px; }
  button[disabled] { cursor: progress; opacity: .88; letter-spacing: .12em; text-indent: .12em; }
  .spin { width: 16px; height: 16px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, .35); border-top-color: #fff; animation: spin .8s linear infinite; display: none; }
  button[disabled] .spin { display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .shake { animation: shake .36s cubic-bezier(.36, .07, .19, .97) both; }
  @keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
  .note { margin: 14px 0 0; font-size: 13px; line-height: 1.8; color: var(--ink-soft); text-align: center; }
  .note-t { display: block; margin-bottom: 8px; font-size: 15px; font-weight: 600; color: var(--ink); }
  [hidden] { display: none !important; }
  @media (prefers-reduced-motion: reduce) { .card, .shake, .spin { animation: none !important; } }
</style>
</head>
<body>
<main class="card" aria-labelledby="t">
  <div class="brand"><img id="logo" src="/logo.png" width="953" height="180" alt="AI心世界 教师工作台"></div>
  <h1 id="t" class="vh">登录 AI心世界</h1>
  <form id="f" novalidate>
    <div class="field">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 20c1.6-3.6 4.6-5.4 8-5.4s6.4 1.8 8 5.4"/></svg>
      <input id="acct" type="text" name="username" placeholder="账号" aria-label="账号" aria-describedby="msg" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" autofocus required>
    </div>
    <div class="field">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="10.5" width="14" height="10" rx="2.5"/><path d="M8.5 10.5V7.8a3.5 3.5 0 0 1 7 0v2.7"/></svg>
      <input id="pw" type="password" name="password" placeholder="密码" aria-label="密码" aria-describedby="msg" autocomplete="current-password" required>
    </div>
    <p id="msg" class="msg" role="alert" aria-live="assertive"></p>
    <button id="go" type="submit"><span class="spin" aria-hidden="true"></span><span id="go-t">登录</span></button>
  </form>
  <p id="framed" class="note" hidden><a href="/" target="_blank" rel="noopener">在新窗口打开</a></p>
  <p id="unsupported" class="note" hidden><b class="note-t">这个浏览器打不开本站</b>微信、QQ 里请点右上角「···」<br>选择“在浏览器打开”<br>或换用 Chrome、Edge、Safari（非无痕模式）</p>
</main>
<script id="gate-config" type="application/json">{"v":3,"build":"20260923T143045-322ede","keyId":"9dd5e1ce1f545e04","commonKeyId":"9dd5e1ce1f545e04","maxAgeDays":30,"realms":{"teacher":{"keyId":"d908696c2770f0f1","acct":1,"kdf":{"name":"PBKDF2","hash":"SHA-256","iterations":4000000,"salt":"c9rR0oJsnK4YA/+8FYPnoA=="},"wrap":{"alg":"AES-GCM","iv":"gFVbvhRcE/1dC1py","data":"yDLAhN+xsTm9wkWtCImD5QB8S5a+6L5E/R689DFfSP9mecgqehjTahVjoOJvtlXj"},"wrapC":{"alg":"AES-GCM","iv":"YPcR2LzQ2gAF/OwR","data":"tqQiz3fWjsoEthjcbLvMtnXSRAl/YpV5SXEsYzdoEf6+7wavGZeCrAUv8xD2D+Te"}},"student":{"keyId":"2546afa114b00a4f","acct":1,"kdf":{"name":"PBKDF2","hash":"SHA-256","iterations":4000000,"salt":"YFWMCNvQbWhs4CeVr8VmUQ=="},"wrap":{"alg":"AES-GCM","iv":"9fJ6KTnJaKifq8z3","data":"Zp+EKH7/vBzXjLua6SgLbR+NrdAYRYL28J2jde/HhL3KWjN7predOIF+aPcCIc9Y"},"wrapC":{"alg":"AES-GCM","iv":"5QChdPt0h5dzDqWN","data":"GZx1D9VI+cg8EehacXcrPbMUJX5LQYS+XHWNFxcSnVvMUchxj+XbJ8SZgm6hRRld"}}}}</script>
<script>
(function () {
  'use strict';
  // ------------------------------------------------------------------
  // 站点访问门：密码 → PBKDF2 派生密钥 → 解开内容密钥 K → 交给 Service Worker
  // 页面内容全部以密文存放，只有拿到 K 的浏览器才能解密显示。
  // ------------------------------------------------------------------
  var INLINE = JSON.parse(document.getElementById('gate-config').textContent);
  var DB_NAME = 'site-gate', STORE = 'kv', LEGACY_KEY_REC = 'key';
  // 这是哪一端的登录页：/student… 是学生端，其余是教师端。两端的登录互相独立，各记各的钥匙
  var REALM = /^\/student(\.html|\.rsc)?(\/|$)/.test(location.pathname) ? 'student' : 'teacher';
  var KEY_REC = 'key:' + REALM;
  var AUTO_FLAG = 'site-gate-auto';
  var $ = function (id) { return document.getElementById(id); };
  var form = $('f'), acct = $('acct'), pw = $('pw'), msg = $('msg'), go = $('go'), goT = $('go-t');
  // 学生端（/student）用学生端的 logo，其余用教师端的
  if (REALM === 'student') { $('logo').src = '/logo-student.png'; $('logo').alt = 'AI心世界 学生端'; }

  function b64(s) { var bin = atob(s), u = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u; }
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function withTimeout(p, ms) { return Promise.race([p, sleep(ms).then(function () { throw new Error('timeout'); })]); }

  // ---- IndexedDB（与 sw.js 共用同一个库）----
  function idb() {
    return new Promise(function (res, rej) {
      var r = indexedDB.open(DB_NAME, 1);
      r.onupgradeneeded = function () { r.result.createObjectStore(STORE); };
      r.onsuccess = function () { res(r.result); };
      r.onerror = function () { rej(r.error); };
    });
  }
  function idbTx(mode, fn) {
    return idb().then(function (db) {
      return new Promise(function (res, rej) {
        var tx = db.transaction(STORE, mode), st = tx.objectStore(STORE), out;
        var req = fn(st);
        if (req) req.onsuccess = function () { out = req.result; };
        tx.oncomplete = function () { db.close(); res(out); };
        tx.onerror = tx.onabort = function () { db.close(); rej(tx.error); };
      });
    });
  }
  var idbGet = function (k) { return idbTx('readonly', function (s) { return s.get(k); }); };
  var idbPut = function (k, v) { return idbTx('readwrite', function (s) { return s.put(v, k); }); };
  var idbDel = function (k) { return idbTx('readwrite', function (s) { return s.delete(k); }); };

  // 登录后要去的地址：就是当前地址（去掉 ?lock），而且一定留在本站。
  // 注意：'//evil.example/' 这种路径若单独交给 location.replace 会被当成别的网站，
  // 所以始终用完整的同源网址，并把开头多余的斜杠合并掉。
  function target() {
    var u = new URL(location.href);
    u.searchParams.delete('lock');
    u.pathname = u.pathname.replace(/^\/{2,}/, '/');
    if (u.pathname.indexOf('/_gate/') === 0) u.pathname = '/';
    if (u.origin !== location.origin) return new URL('/', location.href).href;
    return u.href;
  }

  // 最新的门配置（刚发布新版本时，缓存里的旧页面也能拿到新配置）
  function latestConfig() {
    return withTimeout(fetch('/_gate/config.json', { cache: 'no-store', credentials: 'same-origin' }), 6000)
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (c) { return c && c.realms && c.realms[REALM] ? c : INLINE; })
      .catch(function () { return INLINE; });
  }

  function setBusy(on, text) {
    go.disabled = on; pw.disabled = on; acct.disabled = on;
    goT.textContent = on ? (text || '正在验证') : '登录';
  }
  // field：出错的是哪个框（默认密码框）；账号或密码不对时两个框都标红
  function showError(text, field, both) {
    field = field || pw;
    msg.className = 'msg'; msg.textContent = text;
    field.setAttribute('aria-invalid', 'true');
    if (both) acct.setAttribute('aria-invalid', 'true');
    form.classList.remove('shake'); void form.offsetWidth; form.classList.add('shake');
    field.focus(); field.select();
  }
  function clearError() { msg.textContent = ''; pw.removeAttribute('aria-invalid'); acct.removeAttribute('aria-invalid'); }
  function showInfo(text) { msg.className = 'msg info'; msg.textContent = text; }
  function unsupported() {
    form.hidden = true; $('unsupported').hidden = false;
  }

  var supported = !!navigator.serviceWorker &&!!window.indexedDB && !!(window.crypto && crypto.subtle) && window.isSecureContext;
  var regPromise = null;
  function register() {
    if (!regPromise) regPromise = navigator.serviceWorker.register('/sw.js', { scope: '/', updateViaCache: 'none' });
    return regPromise;
  }

  // 等 Service Worker 真正激活
  function activeWorker(reg) {
    return new Promise(function (res, rej) {
      function check() {
        var w = reg.active;
        if (w && w.state === 'activated') return res(w);
        var cand = reg.installing || reg.waiting || reg.active;
        if (!cand) return;
        cand.addEventListener('statechange', function () {
          if (cand.state === 'activated') res(cand);
          else if (cand.state === 'redundant') check();
        });
      }
      reg.addEventListener('updatefound', check);
      check();
      setTimeout(function () { reg.active ? res(reg.active) : rej(new Error('sw-timeout')); }, 15000);
    });
  }
  // 通知 Service Worker 重新读取密钥，并等它回话
  function tell(worker, type) {
    return new Promise(function (res) {
      var ch = new MessageChannel();
      ch.port1.onmessage = function (e) { res(e.data); };
      try { worker.postMessage({ type: type }, [ch.port2]); } catch (e) { res(null); }
      setTimeout(function () { res(null); }, 3000);
    });
  }

  function enter() {
    // 防止极端情况下 门 ↔ 页面 来回跳
    try {
      var a = JSON.parse(sessionStorage.getItem(AUTO_FLAG) || '{"n":0,"t":0}');
      if (Date.now() - a.t > 20000) a = { n: 0, t: Date.now() };
      a.n++;
      sessionStorage.setItem(AUTO_FLAG, JSON.stringify(a));
      if (a.n > 3) {
        sessionStorage.removeItem(AUTO_FLAG);
        setBusy(false); showError('页面没能打开，请刷新后重试');
        return Promise.resolve();
      }
    } catch (e) {}
    return register().then(activeWorker).then(function (w) {
      return tell(w, 'refresh');
    }).then(function () {
      var to = target();
      if (new URL(to, location.href).origin !== location.origin) throw new Error('cross-origin');
      // 地址不变时用 reload：带 #锚点 的同地址 replace 只会滚动，不会重新请求
      if (to === location.href) location.reload();
      else location.replace(to);
    }).catch(function () {
      setBusy(false); showError('页面没能打开，请刷新后重试');
    });
  }

  // 解锁用的口令 = 账号（不分大小写）+ 换行 + 密码。这一端的配置里包着两把钥匙：这一端自己的页面钥匙、两端共用的资源钥匙
  function unlock(account, password) {
    return latestConfig().then(function (cfg) {
      var rc = cfg.realms[REALM];
      var enc = new TextEncoder();
      var subtle = crypto.subtle;
      var cred = rc.acct ? account.normalize('NFC').toLowerCase() + '\n' + password.normalize('NFC') : password.normalize('NFC');
      var unwrap = function (kek, w, keyId) {
        return subtle.unwrapKey('raw', b64(w.data), kek, { name: 'AES-GCM', iv: b64(w.iv), additionalData: enc.encode('site-gate/v1/' + keyId) },
          { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
      };
      return subtle.importKey('raw', enc.encode(cred), 'PBKDF2', false, ['deriveKey'])
        .then(function (base) {
          return subtle.deriveKey({ name: 'PBKDF2', hash: 'SHA-256', salt: b64(rc.kdf.salt), iterations: rc.kdf.iterations },
            base, { name: 'AES-GCM', length: 256 }, false, ['unwrapKey']);
        })
        .then(function (kek) {
          // 账号或密码不对时 GCM 校验失败，这里会抛错
          return Promise.all([unwrap(kek, rc.wrap, rc.keyId), unwrap(kek, rc.wrapC, cfg.commonKeyId)]);
        })
        .then(function (ks) {
          var now = Date.now();
          return idbPut(KEY_REC, { realm: REALM, keyId: rc.keyId, key: ks[0], ckeyId: cfg.commonKeyId, ckey: ks[1], t: now, exp: now + (cfg.maxAgeDays || 30) * 864e5, build: cfg.build })
            .then(function () { return true; });
        }, function () { return false; });
    });
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var a = acct.value.trim(), v = pw.value.trim();
    if (!a) { showError('请输入账号', acct); return; }
    if (!v) { showError('请输入密码'); return; }
    clearError();
    setBusy(true, '正在验证');
    var t0 = performance.now();
    unlock(a, v).then(function (ok) {
      window.__gateUnlockMs = Math.round(performance.now() - t0);
      if (!ok) { setBusy(false); showError('账号或密码不对', pw, true); return; }
      setBusy(true, '正在进入');
      try { sessionStorage.removeItem(AUTO_FLAG); } catch (e) {}
      return enter();
    }).catch(function () { setBusy(false); showError('出了点问题，请刷新后重试'); });
  });
  var onInput = function () { if (msg.textContent) clearError(); };
  pw.addEventListener('input', onInput); acct.addEventListener('input', onInput);

  // 被别的网站用 iframe 套住时：尝试跳出；跳不出就不显示密码框（防止借壳骗密码）
  function framed() {
    try { if (window.top === window.self) return false; } catch (e) {}
    try { window.top.location.href = location.href; } catch (e) {}
    form.hidden = true;
    var link = $('framed').firstChild; link.href = target();
    $('framed').hidden = false;
    return true;
  }

  function main() {
    if (framed()) return;
    if (!supported) { unsupported(); return; }
    // 先把 Service Worker 注册上（下载解密器），用户输密码时它已准备好
    register().catch(function () { unsupported(); });
    var url = new URL(location.href);
    idbDel(LEGACY_KEY_REC).catch(function () {});   // 老版本（整站一把钥匙）留下的记录
    if (url.searchParams.has('lock')) {
      // 退出这一端：清掉这台设备上这一端的钥匙（另一端不受影响）
      // （Service Worker 处理带 ?lock 的页面请求时已先清掉；这里再清一次存储并通知它，不等回话）
      try { if (navigator.serviceWorker.controller) navigator.serviceWorker.controller.postMessage({ type: 'lock', realm: REALM }); } catch (e) {}
      idbDel(KEY_REC).catch(function () {}).then(function () {
        try { history.replaceState(null, '', target()); } catch (e) {}
        showInfo('已退出');
        register().then(function (reg) { if (reg.active) reg.active.postMessage({ type: 'lock', realm: REALM }); }).catch(function () {});
      });
      return;
    }
    // 这台设备已登录这一端（例如强制刷新绕过了 Service Worker）：直接进入
    idbGet(KEY_REC).then(function (rec) {
      if (!rec || !rec.key || !(rec.exp > Date.now())) return;
      return latestConfig().then(function (cfg) {
        if (rec.keyId !== cfg.realms[REALM].keyId || rec.ckeyId !== cfg.commonKeyId) return idbDel(KEY_REC);
        setBusy(true, '正在进入');
        return enter();
      });
    }).catch(function () {});
  }
  main();
})();
</script>
</body>
</html>
